version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(github)"
    groups:
      gha:
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "github-actions"

  # Must be "uv", not "pip": the pip updater edits pyproject.toml without
  # regenerating uv.lock, and every tox env runs `uv sync --locked`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # `dependency-type: "development"` is pip-only, so the dev group is
      # expressed as everything minus the runtime deps.
      dev:
        patterns:
          - "*"
        exclude-patterns:
          - "structlog"
    open-pull-requests-limit: 10
    labels:
      - "automerge"
      - "dependencies"

  # Hook revs in .pre-commit-config.yaml. They drift independently of the
  # pinned tool versions in pyproject.toml.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      pre-commit:
        patterns:
          - "*"
    labels:
      - "automerge"
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build(docker)"
    labels:
      - "docker"
      - "dependencies"
