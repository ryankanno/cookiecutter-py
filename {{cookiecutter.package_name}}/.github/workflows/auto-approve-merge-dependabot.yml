name: auto approve + merge dependabot prs

on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled
      - synchronize
  check_suite:
    types:
      - completed
  status: {}

jobs:
  auto-approve:
    name: Auto approve Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: |
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == 'dependabot' ||
        github.event.pull_request.user.login == 'dependabot-preview[bot]' ||
        github.event.pull_request.user.login == 'dependabot-preview'
      ) && (
        github.actor == 'dependabot[bot]' ||
        github.actor == 'dependabot' ||
        github.actor == 'dependabot-preview[bot]' ||
        github.actor == 'dependabot-preview'
      )
    steps:
      - name: Approve
        env:
          GH_TOKEN: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"
          PR_URL: "{% raw %}${{ github.event.pull_request.html_url }}{% endraw %}"
        # Dependabot assigns two labels and GitHub fires a separate
        # `labeled` event for each, so this job runs more than once
        # per PR. Re-approving returns 422 and fails the run.
        run: |
          states=$(gh pr view "$PR_URL" --json reviews \
            --jq '.reviews[] | select(.author.login == "github-actions[bot]") | .state')
          case "$states" in
            *APPROVED*) echo "Already approved; nothing to do." ;;
            *) gh pr review --approve "$PR_URL" ;;
          esac
  auto-merge:
    name: Auto merge Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    needs: auto-approve
    if: |
      github.actor == 'dependabot[bot]' ||
      github.actor == 'dependabot' ||
      github.actor == 'dependabot-preview[bot]' ||
      github.actor == 'dependabot-preview'
    steps:
      - name: Retrieve Dependabot metadata
        id: dependabot-metadata
        uses: "dependabot/fetch-metadata@v3.1.0"
        with:
          github-token: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"
      - name: Wait for status checks
        id: wait-for-status-checks
        uses: "wyrihaximus/github-action-wait-for-status@v1.7.1"
        with:
          ignoreActions: "Auto merge Dependabot PRs"
          checkInterval: 30
        env:
          GITHUB_TOKEN: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"
      - name: Auto merge
        if: |
          steps.wait-for-status-checks.outputs.status == 'success' &&
          steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
        id: automerge
        uses: "pascalgn/automerge-action@v0.16.4"
        env:
          GITHUB_TOKEN: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"
          MERGE_LABELS: "automerge,!major"
          MERGE_REMOVE_LABELS: ""
          MERGE_METHOD: "squash"
          MERGE_COMMIT_MESSAGE: "pull-request-title-and-description"
          MERGE_FORKS: "false"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "30000"
          MERGE_REQUIRED_APPROVALS: "1"
          UPDATE_METHOD: "rebase"
