version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "ryankanno"
    commit-message:
      prefix: "build(github)"
    groups:
      gha:
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "github-actions"

  # Python deps for this template repo itself, not the generated project.
  # Must be "uv", not "pip": the pip updater edits pyproject.toml without
  # regenerating uv.lock, and every tox env runs `uv sync --locked`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Must exceed `exclude-newer` in pyproject.toml, or uv refuses to
    # resolve the very versions Dependabot proposes. Both count from the
    # release publication date; the extra day avoids the boundary.
    cooldown:
      default-days: 15
    assignees:
      - "ryankanno"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # `dependency-type: "development"` is pip-only, so the dev group is
      # expressed as everything minus the runtime deps.
      dev:
        patterns:
          - "*"
        exclude-patterns:
          - "cookiecutter"
          - "setuptools"
    open-pull-requests-limit: 10
    labels:
      - "automerge"
      - "dependencies"

  # Hook revs in .pre-commit-config.yaml, which nothing else updated. They
  # drift independently of the pinned tool versions in pyproject.toml.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    # Hook environments install through uv, so they inherit `exclude-newer`
    # too. Only default-days is supported for this ecosystem.
    cooldown:
      default-days: 15
    assignees:
      - "ryankanno"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      pre-commit:
        patterns:
          - "*"
    labels:
      - "automerge"
      - "dependencies"

  # NOTE: no "uv"/"pip" or "github-actions" entry for the template directory.
  # Its pyproject.toml and workflows are Jinja2, not valid TOML/YAML, so
  # Dependabot errors with "Dependabot can't parse your pyproject.toml" and
  # finds no workflow manifests at all. Bumping the template's own pins is
  # manual. Only its non-templated files (Dockerfile) can be serviced here.

  - package-ecosystem: "docker"
    directory: "{{cookiecutter.package_name}}"
    schedule:
      interval: "weekly"
    assignees:
      - "ryankanno"
    commit-message:
      prefix: "build(docker)"
    labels:
      - "docker"
      - "dependencies"
