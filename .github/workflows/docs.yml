name: docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

  # manual; optionally backfill a specific tag's docs to a named version dir
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build docs from (branch, tag, or SHA). Defaults to the branch the workflow is dispatched from.'
        required: false
        default: ''
      version:
        description: 'Destination directory under gh-pages (e.g. 2.0.0, latest). Defaults to latest.'
        required: false
        default: ''

env:
  UV_VERSION: 0.7.3
  TOX_VERSION: 4.25.0
  PRE_COMMIT_CACHE: ~/.cache/pre-commit

jobs:
  tox-docs:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
        os: [ubuntu-latest]
        env:
          - TOXENV: "docs"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Configure Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}-uv_docs
      - name: Install tox
        run: uv tool install --python-preference only-system tox==${{ env.TOX_VERSION }} --with tox-gh
      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ${{ env.PRE_COMMIT_CACHE }}
          key: ${{ matrix.os }}-${{ matrix.python-version }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run tox
        run: |
          tox
        shell: bash
        env: ${{ matrix.env }}
      - name: Prepare docs artifact
        if: always()
        shell: bash
        run: |
          mkdir artifact
          cp -a .tox/docs_out/ artifact/html_docs
      - name: Upload docs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html_docs
          path: ./artifact

  deploy:
    needs: tox-docs
    if: >-
      ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
          || github.event_name == 'release'
          || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Determine destination directory
        id: dest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "dir=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "dir=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
      - name: Download docs artifact
        uses: actions/download-artifact@v7
        with:
          name: html_docs
          path: ./artifact
      - name: Sync HTML into version directory
        shell: bash
        run: |
          DEST="${{ steps.dest.outputs.dir }}"
          rm -rf "gh-pages/${DEST}"
          mkdir -p "gh-pages/${DEST}"
          cp -a artifact/html_docs/. "gh-pages/${DEST}/"
      - name: Regenerate versions.json
        shell: bash
        working-directory: gh-pages
        run: |
          touch .nojekyll
          python3 - <<'PY'
          import json, pathlib, re

          root = pathlib.Path(".")
          version_re = re.compile(r"^\d+\.\d+\.\d+([._-].+)?$")

          entries = []
          for child in sorted(root.iterdir()):
              if not child.is_dir() or child.name.startswith("."):
                  continue
              name = child.name
              if name == "latest" or version_re.match(name):
                  entries.append(name)

          def sort_key(name: str):
              if name == "latest":
                  return (0, ())
              parts = re.split(r"[._-]", name)
              nums = []
              for part in parts:
                  try:
                      nums.append(int(part))
                  except ValueError:
                      nums.append(part)
              return (1, tuple(-n if isinstance(n, int) else n for n in nums))

          entries.sort(key=sort_key)
          payload = [{"name": name, "url": f"/cookiecutter-py/{name}/"} for name in entries]
          pathlib.Path("versions.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - name: Commit and push gh-pages branch
        shell: bash
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to publish."
          else
            git commit -m "deploy: ${{ steps.dest.outputs.dir }} from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
      - name: Stage Pages payload
        shell: bash
        run: |
          mkdir -p _pages_payload
          cp -a gh-pages/. _pages_payload/
          rm -rf _pages_payload/.git
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_payload
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
